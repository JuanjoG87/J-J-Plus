name: Refresh documentation manifest

on: [push]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Refresh documentation integrity manifest'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-doc-manifest.yml

          find . -type f \
            ! -path './.git/*' \
            ! -name 'SHA256SUMS_ALL.txt' \
            -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' \
            > SHA256SUMS_ALL.txt

          sha256sum -c SHA256SUMS_ALL.txt

          git config user.name "J/J+ Public Review"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Refresh documentation integrity manifest [skip ci]"
          git push origin HEAD:main
