name: Materialize J/J+ Public Review 0.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-public-review.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify publication tree
        shell: bash
        run: |
          set -euo pipefail

          cat .bootstrap/part-* > /tmp/jjp-public-review.b64
          base64 --decode /tmp/jjp-public-review.b64 > /tmp/jjp-public-review.tar.xz

          echo "c721e4a4323fa2eccaba8e894619aadfbffcd32f9d3b730c2e05555b440b405e  /tmp/jjp-public-review.tar.xz" | sha256sum -c -

          mkdir -p /tmp/jjp-public-review
          tar -xJf /tmp/jjp-public-review.tar.xz -C /tmp/jjp-public-review

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/jjp-public-review/JJP_v0.1.0-preview.14_PUBLIC_REVIEW_CANDIDATE/. .

          sha256sum -c SHA256SUMS_ALL.txt

          test "$(find . -type f ! -path './.git/*' | wc -l)" -eq 508
          test ! -e .bootstrap
          test ! -e .init

      - name: Publish verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "J/J+ Public Review"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish J/J+ Public Review 0.1 [skip ci]"
          git push origin HEAD:main
