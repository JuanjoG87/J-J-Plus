name: Finalize J/J+ GitHub presentation

on: [push]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize J/J+ GitHub presentation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify public quick start and self-host fixed point
        shell: bash
        run: |
          set -euo pipefail

          (cd bootstrap/linux_x86_64 && sha256sum -c SHA256SUMS.txt)
          chmod +x bootstrap/linux_x86_64/jjc-root

          bootstrap/linux_x86_64/jjc-root examples/HELLO_BUILD.txt /tmp/hello.o
          echo "eec353afe4842b433ed17798be1a78eff20049e78a6f924ebf5c16eb0917403b  /tmp/hello.o" | sha256sum -c -
          chmod +x /tmp/hello.o
          /tmp/hello.o

          bootstrap/linux_x86_64/jjc-root examples/GUARDED_BUILD.txt /tmp/guarded.o
          echo "0f22cde5f0f48829c5d6710473dd158d8594d7e281cc7dba569bc4fe5ff37538  /tmp/guarded.o" | sha256sum -c -

          bootstrap/linux_x86_64/jjc-root examples/EFFECT_READ_BUILD.txt /tmp/effect-read.o
          echo "ffeddb59b7df6d7194843dd0940d179369cdb2c5da7e5f7c53872e7d066c9b5f  /tmp/effect-read.o" | sha256sum -c -

          bootstrap/linux_x86_64/jjc-root spec/PUBLIC_REVIEW_0_1_ROOT_BUILD.txt /tmp/root-g2.o
          chmod +x /tmp/root-g2.o
          /tmp/root-g2.o spec/PUBLIC_REVIEW_0_1_ROOT_BUILD.txt /tmp/root-g3.o
          cmp /tmp/root-g2.o /tmp/root-g3.o
          echo "377a6990533d7a47020c3a149ba23eae3901c555913306abb26640329c6eecb3  /tmp/root-g2.o" | sha256sum -c -
          echo "377a6990533d7a47020c3a149ba23eae3901c555913306abb26640329c6eecb3  /tmp/root-g3.o" | sha256sum -c -

      - name: Improve repository About metadata
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            repos/MinOSPlus/J-J-Plus/topics \
            -f 'names[]=jjplus' \
            -f 'names[]=programming-language' \
            -f 'names[]=compiler' \
            -f 'names[]=systems-programming' \
            -f 'names[]=self-hosting' \
            -f 'names[]=reproducible-builds' \
            -f 'names[]=capability-security' \
            -f 'names[]=static-analysis' \
            -f 'names[]=multi-architecture' \
            -f 'names[]=human-ai' \
            -f 'names[]=bare-metal' \
            -f 'names[]=paraguay'

          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            repos/MinOSPlus/J-J-Plus \
            -f 'description=Self-hosting systems language with explicit semantics and authority, designed for humans and AI.' \
            -f 'homepage=https://github.com/MinOSPlus/J-J-Plus/releases/tag/public-review-0.1'

      - name: Refresh repository checksum manifest and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail

          rm -f .github/workflows/finalize-github-presentation.yml

          find . -type f \
            ! -path './.git/*' \
            ! -name 'SHA256SUMS_ALL.txt' \
            -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' \
            > SHA256SUMS_ALL.txt

          test "$(wc -l < SHA256SUMS_ALL.txt)" -eq "$(($(find . -type f ! -path './.git/*' | wc -l)-1))"
          sha256sum -c SHA256SUMS_ALL.txt

          git config user.name "J/J+ Public Review"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize GitHub presentation and quick start [skip ci]"
          git push origin HEAD:main
