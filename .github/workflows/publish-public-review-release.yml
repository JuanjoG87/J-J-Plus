name: "Publish Public Review Release"

on: [push]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Trigger J/J+ Public Review release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET="73a65dac3bbefc4dc7873fce7d88f5102f7a8b4d"
          ARCHIVE="/tmp/JJP_Public_Review_0.1_Preview.14.zip"
          CHECKSUM="/tmp/JJP_Public_Review_0.1_Preview.14.zip.sha256"
          git archive --format=zip --output="$ARCHIVE" "$TARGET"
          cd /tmp
          sha256sum "$(basename "$ARCHIVE")" > "$(basename "$CHECKSUM")"
          gh release create public-review-0.1 --repo JuanjoG87/J-J-Plus --target "$TARGET" --title "J/J+ Public Review 0.1 - Preview.14" --notes "Experimental source-visible J/J+ compiler/language review candidate. Technical baseline: Preview.14. Includes bilingual documentation, reproducibility evidence, self-hosting fixed points, cross-lineage gates, and reviewed x86-64, AArch64, ARM32 and i386 paths. Not production-ready, not ABI-frozen, and distributed under the OMEGA Research Source Notice." "$ARCHIVE" "$CHECKSUM"
