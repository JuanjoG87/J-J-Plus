name: Publish J/J+ Public Review 0.1 Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-public-review-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and publish release archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TARGET="73a65dac3bbefc4dc7873fce7d88f5102f7a8b4d"
          ARCHIVE="/tmp/JJP_Public_Review_0.1_Preview.14.zip"
          CHECKSUM="/tmp/JJP_Public_Review_0.1_Preview.14.zip.sha256"

          git archive --format=zip --output="$ARCHIVE" "$TARGET"
          (cd /tmp && sha256sum "$(basename "$ARCHIVE")" > "$(basename "$CHECKSUM")")

          cat > /tmp/release-notes.md <<'EOF'
# J/J+ Public Review 0.1 — Preview.14

Experimental, source-visible J/J+ compiler/language review candidate.

This release is based on the reviewed Preview.14 compiler state and the final bilingual GitHub publication tree.

Highlights:
- self-hosting compiler evidence;
- Root / Profile B / Diagnostic fixed points;
- cross-lineage byte-exact rebuild evidence;
- x86-64, AArch64, ARM32 and i386 reviewed target paths;
- explicit capabilities, effects, provenance and authority-state infrastructure;
- English and Spanish documentation;
- reproducibility evidence and repository-wide checksum manifest.

Publication boundary:
- not production-ready;
- not J/J+ 1.0 or ABI-frozen;
- not a complete ownership model;
- no public transfer syntax yet;
- distributed under the OMEGA Research Source Notice, which is not an OSI-approved open-source license.

The attached .sha256 file records the SHA-256 of the downloadable release archive.
EOF

          if gh release view public-review-0.1 >/dev/null 2>&1; then
            echo "Release public-review-0.1 already exists; refusing to overwrite."
            exit 1
          fi

          gh release create public-review-0.1 \
            --target "$TARGET" \
            --title "J/J+ Public Review 0.1 — Preview.14" \
            --notes-file /tmp/release-notes.md \
            "$ARCHIVE" "$CHECKSUM"

      - name: Remove one-shot publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "J/J+ Public Review"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/publish-public-review-release.yml
          git add -A
          git commit -m "Remove one-shot release publisher [skip ci]"
          git push origin HEAD:main
